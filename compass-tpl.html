<div class="compass-wrap" style="--accent:#7cc4ff;">
 <input type="radio" class="m-tilt" name="dial" id="reset" checked>
 <input type="radio" class="m-tilt" name="dial" id="t-nw">
 <input type="radio" class="m-tilt" name="dial" id="t-ne">
 <input type="radio" class="m-tilt" name="dial" id="t-w">
 <input type="radio" class="m-tilt" name="dial" id="t-se">
 <input type="radio" class="m-tilt" name="dial" id="t-s">
 <label for="reset" class="reset-area"></label>
 <div class="compass-stage">
  <div class="compass-dial" data-tilt-target>
   <span class="dir dir-n">N</span>
   <span class="dir dir-s">S</span>
   <span class="dir dir-w">W</span>
   <span class="dir dir-e">E</span>
   <div class="n-indicator"></div>
   <label for="t-nw" class="marker" style="top:25%;left:25%;" data-side="top" data-align="left" data-tilt="nw">
    <div class="tip"><div class="tip-head"><b data-p="nm">地点名</b><em>·</em><span data-p="dd">距离·方位</span></div><div class="tip-body" data-p="bd">情报正文</div></div>
   </label>
   <label for="t-ne" class="marker" style="top:25%;left:75%;" data-side="top" data-align="right" data-tilt="ne">
    <div class="tip"><div class="tip-head"><b data-p="nm">地点名</b><em>·</em><span data-p="dd">距离·方位</span></div><div class="tip-body" data-p="bd">情报正文</div></div>
   </label>
   <label for="t-w" class="marker" style="top:55%;left:15%;" data-side="bottom" data-align="left" data-tilt="w">
    <div class="tip"><div class="tip-head"><b data-p="nm">地点名</b><em>·</em><span data-p="dd">距离·方位</span></div><div class="tip-body" data-p="bd">情报正文</div></div>
   </label>
   <label for="t-se" class="marker" style="top:75%;left:75%;" data-side="bottom" data-align="right" data-tilt="se">
    <div class="tip"><div class="tip-head"><b data-p="nm">地点名</b><em>·</em><span data-p="dd">距离·方位</span></div><div class="tip-body" data-p="bd">情报正文</div></div>
   </label>
   <label for="t-s" class="marker" style="top:85%;left:50%;" data-side="bottom" data-align="center" data-tilt="s">
    <div class="tip"><div class="tip-head"><b data-p="nm">地点名</b><em>·</em><span data-p="dd">距离·方位</span></div><div class="tip-body" data-p="bd">情报正文</div></div>
   </label>
   <div class="core"></div>
  </div>
 </div>
</div>
